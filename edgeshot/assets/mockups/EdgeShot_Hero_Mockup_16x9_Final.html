<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeShot Hero Mockup 16:9</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../css/EdgeShot_Hero_Mockup_16x9_Final.css">
</head>
<body>
<div class="hero-capture" aria-label="EdgeShot capture and annotation mockup" data-sun-x="0.346" data-sun-y="0.338">
  <img
    class="hero-capture__image hero-capture__image--dimmed"
    src="../images/hero_sunrise.webp"
    alt=""
    aria-hidden="true"
  >

  <img
    class="hero-capture__image hero-capture__image--selected"
    src="../images/hero_sunrise.webp"
    alt="Mountain sunrise selected in EdgeShot"
  >

  <div class="selection" aria-hidden="true">
    <div class="annotation">
      <strong>Look at the sunrise!</strong>
    </div>

    <i class="grabber grabber--tl"></i>
    <i class="grabber grabber--tc"></i>
    <i class="grabber grabber--tr"></i>
    <i class="grabber grabber--ml"></i>
    <i class="grabber grabber--mr"></i>
    <i class="grabber grabber--bl"></i>
    <i class="grabber grabber--bc"></i>
    <i class="grabber grabber--br"></i>
  </div>

  <div class="toolbar" aria-label="EdgeShot Light Toolbar">
    <img src="../icons/TOOLBAR_white.svg" alt="EdgeShot Light Toolbar">
  </div>
</div>

<script src="../../js/EdgeShot_Hero_Mockup_16x9_Final.js"></script>
</body>
</html>
