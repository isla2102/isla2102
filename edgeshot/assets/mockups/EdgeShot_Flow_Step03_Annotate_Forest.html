<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeShot Flow Step 03 — Add Annotation</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../css/EdgeShot_Flow_Step03_Annotate_Forest.css">
</head>
<body>
<div class="flow-shot" aria-label="EdgeShot annotation example">
  <img
    class="flow-shot__image"
    src="../images/flow_forest_milky.webp"
    alt="Forest trail with mountains"
  >

  <div class="selection" aria-hidden="true">
    <div class="annotation">
      <span class="annotation__label">Check this ridge</span>
      <svg class="annotation__arrow" viewBox="0 0 72 38" aria-hidden="true">
        <path d="M6 6 C26 10, 40 18, 57 29"></path>
        <path d="M48 28 L58 30 L55 20"></path>
      </svg>
    </div>

    <i class="grabber grabber--tl"></i>
    <i class="grabber grabber--tc"></i>
    <i class="grabber grabber--tr"></i>
    <i class="grabber grabber--ml"></i>
    <i class="grabber grabber--mr"></i>
    <i class="grabber grabber--bl"></i>
    <i class="grabber grabber--bc"></i>
    <i class="grabber grabber--br"></i>
  </div>
</div>
</body>
</html>
