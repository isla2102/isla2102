<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeShot Flow Step 01 — Area Selection</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../css/EdgeShot_Flow_Step01_Select_Forest_v2.css">
</head>
<body>
<div class="flow-shot" aria-label="EdgeShot area selection example">
  <img
    class="flow-shot__image"
    src="../images/flow_forest_milky.webp"
    alt="Forest trail with mountains"
  >

  <div class="selection" aria-hidden="true">
    <i class="grabber grabber--tl"></i>
    <i class="grabber grabber--tc"></i>
    <i class="grabber grabber--tr"></i>
    <i class="grabber grabber--ml"></i>
    <i class="grabber grabber--mr"></i>
    <i class="grabber grabber--bl"></i>
    <i class="grabber grabber--bc"></i>
    <i class="grabber grabber--br"></i>
  </div>
</div>
</body>
</html>
